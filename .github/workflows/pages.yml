# サイトの公開と、募集ごとの小さなページ（LINEなどのプレビュー用）の自動作成。
# ふだんは、シートに募集が届いたときに Apps Script から repository_dispatch（sheet）で呼ばれる（1〜2分で反映）。
# 5分ごとの schedule は取りこぼし用の保険。GitHubの都合で実際は数時間おきにしか動かないことがある。
name: pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sheet]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: build
        run: node tools/build-pages.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
