# サイトの公開と、募集ごとの小さなページ（LINEなどのプレビュー用）の自動作成。
# ふだんは、シートに募集が届いたときに Apps Script から repository_dispatch（sheet）で呼ばれる（1〜2分で反映）。
# 5分ごとの schedule は取りこぼし用の保険。GitHubの都合で実際は数時間おきにしか動かないことがある。
name: pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sheet]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    env:
      HAS_FREECAL: ${{ secrets.FREECAL_DEPLOY_KEY != '' && secrets.BUSY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # 幹事の予定（フリカレのバックアップ・private）を読みとり専用の鍵で取ってくる。
      # 中身は build-pages.mjs で暗号化して busy.json にするだけで、そのままは公開しない
      - if: env.HAS_FREECAL == 'true'
        uses: actions/checkout@v4
        with:
          repository: b0544109-nk2/freecal-backup
          ssh-key: ${{ secrets.FREECAL_DEPLOY_KEY }}
          path: .freecal
          sparse-checkout: data/calendar.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: build
        run: node tools/build-pages.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          FREECAL_PATH: ${{ env.HAS_FREECAL == 'true' && '.freecal/data/calendar.json' || '' }}
          BUSY_KEY: ${{ secrets.BUSY_KEY }}
      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
